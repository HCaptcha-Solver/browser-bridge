<!doctype html><meta charset="utf-8"><style>
body{margin:0;background:white;color:#172934;font:16px sans-serif}.prompt-text{height:65px;margin:0;background:#287a77;color:white;width:340px}
.challenge-example{position:absolute;top:8px;right:4px;width:60px;height:50px;overflow:hidden}.challenge-example .image{width:60px;height:50px;background:orange}
canvas{display:block;margin:24px 20px 0;touch-action:none}.task-grid{display:grid;grid-template-columns:repeat(3,100px);gap:8px;margin:10px}
.task-image{width:100px;height:100px;position:relative;background:white}.image{width:100%;height:100%;transition:transform .1s}.selected .image{transform:scale(.8)}
.selected:after{content:'✓';position:absolute;right:2px;top:2px;background:green;color:white}.button-submit{margin:12px 20px;height:32px}
</style><h3 class="prompt-text"></h3><div class="challenge-example"><div class="image"></div></div><div id="area"></div><button class="button-submit">Verify</button>
<script>
const mode=MODE;let round=0,version=0,selected=[],down=null,hits=[],ups=0,submissions=0;
window.change=()=>{version++;draw()};
const prompt=document.querySelector('h3'),area=document.querySelector('#area');
function draw(){
 selected=[];down=null;area.replaceChildren();
 const kind=mode==='grid_all'?'grid':mode==='drag_cancel'?'drag':mode==='flow'||mode==='auto'?['point','grid','drag'][round]:'point';
 prompt.textContent=(kind==='point'?'Click both circles':kind==='grid'?'Select the matching grid cells':'Drag the circle to the target')+' '+version;
 if(kind==='grid'){
  const grid=document.createElement('div');grid.className='task-grid';area.append(grid);
  for(let i=0;i<9;i++){const cell=document.createElement('div');cell.className='task-image';
   const image=document.createElement('div');image.className='image';image.style.background=`rgb(${40+i*20},100,190)`;cell.append(image);grid.append(cell);
   cell.onclick=()=>{hits.push([round,i]);cell.classList.toggle('selected');selected.push(i)};
  }
 }else{
  const canvas=document.createElement('canvas');canvas.width=300;canvas.height=260;area.append(canvas);const ctx=canvas.getContext('2d');
  const positions=[[75,78],[210,169]];
  function paint(){
   ctx.globalAlpha=1;ctx.fillStyle=version?'#bde4f5':'#edf0de';ctx.fillRect(0,0,300,260);
   positions.forEach(([x,y],i)=>{ctx.globalAlpha=mode.startsWith('animated')?.55+.45*Math.sin(Date.now()/150+i)**2:1;
    ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fillStyle='#db492f';ctx.fill();});
   ctx.globalAlpha=1;selected.forEach(i=>{ctx.fillStyle='blue';ctx.fillRect(positions[i][0]-5,positions[i][1]-5,10,10)});
  }paint();
  if(mode.startsWith('animated')){const timer=setInterval(()=>canvas.isConnected?paint():clearInterval(timer),30);}
  const local=e=>{const r=canvas.getBoundingClientRect();return [(e.clientX-r.x)*300/r.width,(e.clientY-r.y)*260/r.height]};
  canvas.onmousedown=e=>{down=local(e);};canvas.onmouseup=e=>{
   ups++;const p=local(e);if(kind==='drag'){
    if(down&&Math.hypot(down[0]-75,down[1]-78)<20&&Math.hypot(p[0]-210,p[1]-169)<20)selected=[0,1];
   }else{const i=positions.findIndex(v=>Math.hypot(v[0]-p[0],v[1]-p[1])<20);if(i>=0&&!selected.includes(i)){
    selected.push(i);hits.push([round,i]);ctx.fillStyle='blue';ctx.fillRect(positions[i][0]-5,positions[i][1]-5,10,10);
    if(mode==='mid_change'&&selected.length===1){version++;prompt.textContent='New challenge '+version;}
    if(mode==='animated_change'&&selected.length===1){version++;paint();}
    if(mode==='animated_reference'&&selected.length===1)document.querySelector('.challenge-example .image').style.background='purple';
    if(mode==='auto'&&selected.length===2){round++;draw();}
   }}down=null;
  };
 }
}
document.querySelector('button').onclick=()=>{
 submissions++;const expected=mode==='grid_all'?9:((mode==='flow'||mode==='auto')&&round===1?3:2);
 if(selected.length!==expected)return;
 if(mode==='rejected'&&submissions===1){
  const error=document.createElement('div');error.className='error-text';error.textContent='Please try again';document.body.append(error);
  setTimeout(()=>area.setAttribute('aria-busy','true'),450);
  setTimeout(()=>{area.removeAttribute('aria-busy');version++;draw()},1000);
  return;
 }
 if((mode==='flow'||mode==='auto')&&round<2){round++;draw()}else parent.postMessage('done','*');
};
window.fixtureState=()=>({round,hits,ups,submissions,selected,version});draw();
setInterval(()=>document.body.dataset.state=JSON.stringify(window.fixtureState()),20);
new MutationObserver(records=>{if(records.some(r=>r.attributeName==='data-change'))window.change();}).observe(document.body,{attributes:true});
</script>
