[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hcaptcha-browser-bridge"
version = "0.1.0"
description = "HCaptcha Solver client for your Python automation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.28,<1", "Pillow>=11,<13"]

[project.optional-dependencies]
browser = ["patchright>=1.63,<2"]
test = ["patchright>=1.63,<2", "pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.urls]
Homepage = "https://github.com/HCaptcha-Solver/browser-bridge"
Documentation = "https://hcaptchasolver.org/?lang=en#/docs"

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.setuptools.package-data]
hcaptcha_bridge = ["widget.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
